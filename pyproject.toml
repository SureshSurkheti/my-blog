[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["blog/migrations/0001_initial.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "DJ",  # flake8-django
    "C4",  # comprehensions
]
ignore = [
    "E501",  # long lines are handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"blog/migrations/*" = ["E501"]
"my_site/settings.py" = ["F405"]

[tool.coverage.run]
source = ["blog", "my_site"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "*/wsgi.py",
    "*/asgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
