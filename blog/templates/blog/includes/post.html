{% load blog_extras %}
<li>
  <article class="post">
    <a href="{{ post.get_absolute_url }}">
      {% if post.image %}
      <img src="{{ post.image.url }}" alt="{{ post.title }}" loading="lazy"
           {% if post.image_width %}width="{{ post.image_width }}" height="{{ post.image_height }}"{% endif %}
           style="object-position: {{ post.focal_css }}" />
      {% endif %}
      <div class="post__content">
        <h3>{{ post.title }}</h3>
        <p class="post__meta">
          <time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"d M Y" }}</time>
          · {{ post.content|reading_time }} min read
        </p>
        <p>{{ post.excerpt }}</p>
      </div>
    </a>
  </article>
</li>
