{% load blog_extras %}
{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
  <a href="?{% query_replace page=page_obj.previous_page_number %}" rel="prev">&larr; Newer</a>
  {% else %}
  <span class="pagination__disabled">&larr; Newer</span>
  {% endif %}

  <span class="pagination__status">
    Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
  </span>

  {% if page_obj.has_next %}
  <a href="?{% query_replace page=page_obj.next_page_number %}" rel="next">Older &rarr;</a>
  {% else %}
  <span class="pagination__disabled">Older &rarr;</span>
  {% endif %}
</nav>
{% endif %}
