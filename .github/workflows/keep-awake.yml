name: Keep the site awake

# Render stops a free web service after 15 minutes with no requests, and
# starting it again takes the better part of a minute — the visitor who
# triggers it just waits. A request every few minutes means the service is
# never idle long enough to be stopped, so there is never anything to start.
#
# This is a backup for a proper uptime monitor, not a replacement: GitHub
# states that scheduled workflows can be delayed when its runners are busy,
# and a delay past 15 minutes lets the site sleep. A monitoring service fires
# on time; this does not. Running both costs nothing and covers the gaps.

on:
  schedule:
    # UTC. 22:00–16:00 UTC is 07:00–01:00 in Tokyo: nineteen hours a day,
    # which keeps the month around 590 of the 750 free instance-hours. Awake
    # around the clock would be 744 and leave no room for anything else.
    # The site sleeps overnight, when nobody here is reading it.
    #
    # Offset off the hour because GitHub's scheduler is busiest on the hour.
    - cron: "3,13,23,33,43,53 22,23,0-16 * * *"
  workflow_dispatch: # so it can be run by hand to check it works

concurrency:
  # A delayed run must not pile up behind the next one.
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the blog
        env:
          URL: https://blog.sureshsurkheti.com/
        run: |
          # One request, then out. Holding the runner open to ping again
          # would burn roughly ten times the runner minutes for a few extra
          # minutes of cover, and GitHub asks that Actions not be used for
          # work unrelated to building the project. A short job every ten
          # minutes is a far easier thing to justify.
          #
          # Never fails the job: a red tick on a keep-alive is noise, and the
          # next run is along in ten minutes whatever happened here.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                   --max-time 120 "$URL" || echo "000")
          echo "$(date -u '+%H:%M:%S') UTC  ping -> HTTP $code"
